            checkGenerate32Button();
        }

        // 渲染小组赛阶段
        function renderGroupStage() {
            const container = document.getElementById('groupsContainer');
            container.innerHTML = '';

            const groups = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
            
            groups.forEach(group => {
                const groupElement = document.createElement('div');
                groupElement.className = 'group-card';
                
                // 小组头部
                groupElement.innerHTML = `
                    <div class="group-header">${group}组</div>
                    <div class="p-4">
                        <div class="standings-row standings-header">
                            <span class="col-span-2">球队</span>
                            <span>场次</span>
                            <span>胜</span>
                            <span>平</span>
                            <span>积分</span>
                            <span>净胜</span>
                        </div>
                        <div id="standings-${group}"></div>
                        
                        <div class="mt-4 border-t pt-4">
                            <h4 class="font-bold mb-3 text-primary">小组赛程</h4>
                            <div id="matches-${group}"></div>
                        </div>
                    </div>
                `;
                
                container.appendChild(groupElement);
                
                // 渲染该小组的比赛
                renderGroupMatches(group);
                
                // 计算并渲染积分榜
                calculateGroupStandings(group);
            });
        }

        // 渲染小组比赛
        function renderGroupMatches(group) {
            const container = document.getElementById(`matches-${group}`);
            const matches = groupMatches.filter(m => m.group === group);
            
            matches.forEach(match => {
                const matchElement = document.createElement('div');
                matchElement.className = 'flex justify-between items-center py-2 border-b border-gray-100 last:border-0';
                
                const result = matchResults[match.id] || { score1: '', score2: '' };
                
                matchElement.innerHTML = `
                    <div class="text-xs text-gray-500 w-12">${match.date}</div>
                    <div class="flex items-center space-x-2 flex-1 justify-end">
                        <span class="text-right w-20">${teams[match.team1].name}</span>
                        <input type="number" min="0" max="99" class="score-input" data-match="${match.id}" data-team="1" value="${result.score1}">
                        <span class="font-bold">:</span>
                        <input type="number" min="0" max="99" class="score-input" data-match="${match.id}" data-team="2" value="${result.score2}">
                        <span class="w-20">${teams[match.team2].name}</span>
                    </div>
                `;
                
                container.appendChild(matchElement);
                
                // 添加输入事件监听
                const inputs = matchElement.querySelectorAll('.score-input');
                inputs.forEach(input => {
                    input.addEventListener('input', (e) => {
                        const matchId = e.target.dataset.match;
                        const team = e.target.dataset.team;
                        const value = e.target.value;
                        
                        if (!matchResults[matchId]) {
                            matchResults[matchId] = { score1: '', score2: '' };
                        }
                        
                        matchResults[matchId][`score${team}`] = value;
                        
                        // 自动保存
                        saveResults();
                        
                        // 更新积分榜
                        calculateGroupStandings(group);
                        
                        // 更新进度
                        updateProgress();
                        
                        // 检查生成32强按钮状态
                        checkGenerate32Button();
                    });
                });
            });
        }

        // 计算小组积分榜
        function calculateGroupStandings(group) {
            const container = document.getElementById(`standings-${group}`);
            const matches = groupMatches.filter(m => m.group === group);
            
            // 初始化球队数据
            const teamStats = {};
            for (let i = 1; i <= 4; i++) {
                const teamId = `${group}${i}`;
                teamStats[teamId] = {
                    team: teams[teamId],
                    played: 0,
                    won: 0,
                    drawn: 0,
                    lost: 0,
                    goalsFor: 0,
                    goalsAgainst: 0,
                    points: 0
                };
            }
            
            // 计算每场比赛结果
            matches.forEach(match => {
                const result = matchResults[match.id];
                if (result && result.score1 !== '' && result.score2 !== '') {
                    const score1 = parseInt(result.score1);
                    const score2 = parseInt(result.score2);
                    
                    // 更新球队1数据
                    teamStats[match.team1].played++;
                    teamStats[match.team1].goalsFor += score1;
                    teamStats[match.team1].goalsAgainst += score2;
                    
                    // 更新球队2数据
                    teamStats[match.team2].played++;
                    teamStats[match.team2].goalsFor += score2;
                    teamStats[match.team2].goalsAgainst += score1;
                    
                    // 计算积分
                    if (score1 > score2) {
                        teamStats[match.team1].won++;
                        teamStats[match.team1].points += 3;
                        teamStats[match.team2].lost++;
                    } else if (score1 < score2) {
                        teamStats[match.team2].won++;
                        teamStats[match.team2].points += 3;
                        teamStats[match.team1].lost++;
                    } else {
                        teamStats[match.team1].drawn++;
                        teamStats[match.team1].points += 1;
                        teamStats[match.team2].drawn++;
                        teamStats[match.team2].points += 1;
                    }
                }
            });
            
            // 转换为数组并排序
            const sortedTeams = Object.values(teamStats).sort((a, b) => {
                // 先比积分
                if (b.points !== a.points) return b.points - a.points;
                // 再比净胜球
                const gdA = a.goalsFor - a.goalsAgainst;
                const gdB = b.goalsFor - b.goalsAgainst;
                if (gdB !== gdA) return gdB - gdA;
                // 再比进球数
                if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
                // 最后按名称排序
                return a.team.name.localeCompare(b.team.name);
            });
            
            // 渲染积分榜
            container.innerHTML = '';
            sortedTeams.forEach((team, index) => {
                const gd = team.goalsFor - team.goalsAgainst;
                let rowClass = '';
                
                // 前两名标记为已晋级
                if (index < 2) {
                    rowClass = 'qualified';
                } else if (index === 2) {
                    rowClass = 'third-place';
                }
                
                const rowElement = document.createElement('div');
                rowElement.className = `standings-row ${rowClass}`;
                rowElement.innerHTML = `
                    <span class="col-span-2">${team.team.name}</span>
                    <span>${team.played}</span>
                    <span>${team.won}</span>
                    <span>${team.drawn}</span>
                    <span class="font-bold">${team.points}</span>
                    <span>${gd >= 0 ? '+' : ''}${gd}</span>
                `;
                container.appendChild(rowElement);
            });
        }

        // 检查小组赛是否全部完成
        function isGroupStageComplete() {
            return groupMatches.every(match => {
                const result = matchResults[match.id];
                return result && result.score1 !== '' && result.score2 !== '';
            });
        }

        // 计算晋级球队
        function calculateQualifiedTeams() {
            const groups = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'];
            const allThirdPlaces = [];
            
            // 获取每个小组的前两名和第三名
            groups.forEach(group => {
                const matches = groupMatches.filter(m => m.group === group);
                const teamStats = {};
                
                for (let i = 1; i <= 4; i++) {
                    const teamId = `${group}${i}`;
                    teamStats[teamId] = {
                        id: teamId,
                        team: teams[teamId],
                        played: 0,
                        won: 0,
                        drawn: 0,
                        lost: 0,
                        goalsFor: 0,
                        goalsAgainst: 0,
                        points: 0
                    };
                }
                
                matches.forEach(match => {
                    const result = matchResults[match.id];
                    const score1 = parseInt(result.score1);
                    const score2 = parseInt(result.score2);
                    
                    teamStats[match.team1].played++;
                    teamStats[match.team1].goalsFor += score1;
                    teamStats[match.team1].goalsAgainst += score2;
                    
                    teamStats[match.team2].played++;
                    teamStats[match.team2].goalsFor += score2;
                    teamStats[match.team2].goalsAgainst += score1;
                    
                    if (score1 > score2) {
                        teamStats[match.team1].won++;
                        teamStats[match.team1].points += 3;
                        teamStats[match.team2].lost++;
                    } else if (score1 < score2) {
                        teamStats[match.team2].won++;
                        teamStats[match.team2].points += 3;
                        teamStats[match.team1].lost++;
                    } else {
                        teamStats[match.team1].drawn++;
                        teamStats[match.team1].points += 1;
                        teamStats[match.team2].drawn++;
                        teamStats[match.team2].points += 1;
                    }
                });
                
                const sortedTeams = Object.values(teamStats).sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    const gdA = a.goalsFor - a.goalsAgainst;
                    const gdB = b.goalsFor - b.goalsAgainst;
                    if (gdB !== gdA) return gdB - gdA;
                    if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
                    return a.team.name.localeCompare(b.team.name);
                });
                
                // 保存前两名
                matchResults[`${group}1`] = sortedTeams[0].id;
                matchResults[`${group}2`] = sortedTeams[1].id;
                
                // 保存第三名用于比较
                allThirdPlaces.push({
                    group: group,
                    ...sortedTeams[2],
                    goalDifference: sortedTeams[2].goalsFor - sortedTeams[2].goalsAgainst
                });
            });
            
            // 选出8个成绩最好的小组第三名
            allThirdPlaces.sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.goalDifference !== a.goalDifference) return b.goalDifference - a.goalDifference;
                if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
                return a.team.name.localeCompare(b.team.name);
            });
            
            // 保存晋级的第三名
            for (let i = 0; i < 8; i++) {
                matchResults[`${allThirdPlaces[i].group}3`] = allThirdPlaces[i].id;
            }
            
            // 标记未晋级的第三名
            for (let i = 8; i < 12; i++) {
                matchResults[`${allThirdPlaces[i].group}3`] = null;
            }
            
            // 保存到本地存储
            saveResults();
            
            // 渲染1/16决赛
            renderRound32();
            
            // 自动切换到1/16决赛标签
            document.querySelector('[data-stage="round32"]').click();
            
            showToast('32强对阵已生成！');
        }

        // 渲染1/16决赛
        function renderRound32() {
            const container = document.getElementById('round32Container');
            container.innerHTML = '';
            
            knockoutStructure.round32.forEach(match => {
                const matchElement = createMatchElement(match);
                container.appendChild(matchElement);
            });
        }

        // 渲染1/8决赛
        function renderRound16() {
            const container = document.getElementById('round16Container');
            container.innerHTML = '';
            
            knockoutStructure.round16.forEach(match => {
                const matchElement = createMatchElement(match);
                container.appendChild(matchElement);
            });
        }

        // 渲染1/4决赛
        function renderQuarterFinals() {
            const container = document.getElementById('quarterContainer');
            container.innerHTML = '';
            
            knockoutStructure.quarter.forEach(match => {
                const matchElement = createMatchElement(match);
                container.appendChild(matchElement);
            });
        }

        // 渲染半决赛
        function renderSemiFinals() {
            const container = document.getElementById('semiContainer');
            container.innerHTML = '';
            
            knockoutStructure.semi.forEach(match => {
                const matchElement = createMatchElement(match);
                container.appendChild(matchElement);
            });
        }

        // 渲染决赛和季军赛
        function renderFinals() {
            const container = document.getElementById('finalContainer');
            container.innerHTML = '';
            
            // 季军赛
            const thirdMatch = knockoutStructure.third[0];
            const thirdElement = createMatchElement(thirdMatch, "季军赛");
            container.appendChild(thirdElement);
            
            // 决赛
            const finalMatch = knockoutStructure.final[0];
            const finalElement = createMatchElement(finalMatch, "决赛");
            container.appendChild(finalElement);
        }

        // 创建比赛元素
        function createMatchElement(match, title = '') {
            const matchElement = document.createElement('div');
            matchElement.className = 'match-card p-4';
            
            let team1Name = match.team1;
            let team2Name = match.team2;
            let isEditable = true;
            
            // 解析球队1
            if (match.team1.endsWith('1') || match.team1.endsWith('2') || match.team1.endsWith('3')) {
                // 小组赛晋级球队
                if (matchResults[match.team1]) {
                    team1Name = teams[matchResults[match.team1]].name;
                } else {
                    team1Name = match.team1;
                    isEditable = false;
                }
            } else if (match.team1.endsWith('W') || match.team1.endsWith('L')) {
                // 上一轮比赛胜者/负者
                const prevMatchId = match.team1.slice(0, -1);
                const prevResult = matchResults[prevMatchId];
                if (prevResult && prevResult.score1 !== '' && prevResult.score2 !== '') {
                    const score1 = parseInt(prevResult.score1);
                    const score2 = parseInt(prevResult.score2);
                    
                    if (match.team1.endsWith('W')) {
                        const winnerId = score1 >= score2 ? prevResult.team1 : prevResult.team2;
                        team1Name = teams[winnerId].name;
                    } else {
                        const loserId = score1 < score2 ? prevResult.team1 : prevResult.team2;
                        team1Name = teams[loserId].name;
                    }
                } else {
                    team1Name = `待定(${match.team1})`;
                    isEditable = false;
                }
            } else {
                // 直接对阵的球队
                team1Name = teams[match.team1].name;
            }
            
            // 解析球队2
            if (match.team2.endsWith('1') || match.team2.endsWith('2') || match.team2.endsWith('3')) {
                if (matchResults[match.team2]) {
                    team2Name = teams[matchResults[match.team2]].name;
                } else {
                    team2Name = match.team2;
                    isEditable = false;
                }
            } else if (match.team2.endsWith('W') || match.team2.endsWith('L')) {
                const prevMatchId = match.team2.slice(0, -1);
                const prevResult = matchResults[prevMatchId];
                if (prevResult && prevResult.score1 !== '' && prevResult.score2 !== '') {
                    const score1 = parseInt(prevResult.score1);
                    const score2 = parseInt(prevResult.score2);
                    
                    if (match.team2.endsWith('W')) {
                        const winnerId = score1 >= score2 ? prevResult.team1 : prevResult.team2;
                        team2Name = teams[winnerId].name;
                    } else {
                        const loserId = score1 < score2 ? prevResult.team1 : prevResult.team2;
                        team2Name = teams[loserId].name;
                    }
                } else {
                    team2Name = `待定(${match.team2})`;
                    isEditable = false;
                }
            } else {
                team2Name = teams[match.team2].name;
            }
            
            const result = matchResults[match.id] || { score1: '', score2: '', team1: match.team1, team2: match.team2 };
            
            // 保存实际对阵的球队ID
            if (!matchResults[match.id]) {
                matchResults[match.id] = { 
                    score1: '', 
                    score2: '', 
                    team1: match.team1, 
                    team2: match.team2,
                    actualTeam1: getTeamIdByName(team1Name),
                    actualTeam2: getTeamIdByName(team2Name)
                };
            }
            
            let titleHtml = title ? `<h3 class="font-bold text-primary mb-3 text-center">${title}</h3>` : '';
            
            matchElement.innerHTML = `
                ${titleHtml}
                <div class="flex justify-between items-center">
                    <div class="text-xs text-gray-500">${match.date}</div>
                    <div class="flex items-center space-x-2 flex-1 justify-center">
                        <span class="text-right w-24">${team1Name}</span>
                        <input type="number" min="0" max="99" class="score-input" data-match="${match.id}" data-team="1" value="${result.score1}" ${!isEditable ? 'disabled' : ''}>
                        <span class="font-bold">:</span>
                        <input type="number" min="0" max="99" class="score-input" data-match="${match.id}" data-team="2" value="${result.score2}" ${!isEditable ? 'disabled' : ''}>
                        <span class="w-24">${team2Name}</span>
                    </div>
                </div>
            `;
            
            // 添加输入事件监听
            if (isEditable) {
                const inputs = matchElement.querySelectorAll('.score-input');
                inputs.forEach(input => {
                    input.addEventListener('input', (e) => {
                        const matchId = e.target.dataset.match;
                        const team = e.target.dataset.team;
                        const value = e.target.value;
                        
                        if (!matchResults[matchId]) {
                            matchResults[matchId] = { score1: '', score2: '' };
                        }
                        
                        matchResults[matchId][`score${team}`] = value;
                        
                        // 自动保存
                        saveResults();
                        
                        // 更新进度
                        updateProgress();
                        
                        // 更新后续比赛
                        updateKnockoutStages();
                        
                        // 检查是否产生冠军
                        checkForChampion();
                    });
                });
            }
            
            return matchElement;
        }

        // 通过球队名称获取ID
        function getTeamIdByName(name) {
            for (const [id, team] of Object.entries(teams)) {
                if (team.name === name) {
                    return id;
                }
            }
            return null;
        }

        // 更新所有淘汰赛阶段
        function updateKnockoutStages() {
            renderRound32();
            renderRound16();
            renderQuarterFinals();
            renderSemiFinals();
            renderFinals();
        }

        // 检查是否产生冠军
        function checkForChampion() {
            const finalResult = matchResults['F'];
            if (finalResult && finalResult.score1 !== '' && finalResult.score2 !== '') {
                const score1 = parseInt(finalResult.score1);
                const score2 = parseInt(finalResult.score2);
                
                let championId;
                if (score1 > score2) {
                    championId = finalResult.actualTeam1 || getTeamIdByName(document.querySelector('#finalContainer .match-card:last-child span:nth-child(2)').textContent);
                } else {
                    championId = finalResult.actualTeam2 || getTeamIdByName(document.querySelector('#finalContainer .match-card:last-child span:nth-child(4)').textContent);
                }
                
                if (championId && teams[championId]) {
                    document.getElementById('championTeam').textContent = teams[championId].name;
                    document.getElementById('championSection').classList.remove('hidden');
                }
            } else {
                document.getElementById('championSection').classList.add('hidden');
            }
        }

        // 设置阶段切换标签
        function setupStageTabs() {
            const tabs = document.querySelectorAll('.stage-tab');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // 移除所有活动状态
                    tabs.forEach(t => {
                        t.classList.remove('stage-tab-active');
                        t.classList.add('stage-tab-inactive');
                    });
                    
                    // 添加当前活动状态
                    tab.classList.remove('stage-tab-inactive');
                    tab.classList.add('stage-tab-active');
                    
                    // 隐藏所有内容
                    document.querySelectorAll('.stage-content').forEach(content => {
                        content.classList.add('hidden');
                    });
                    
                    // 显示对应内容
                    currentStage = tab.dataset.stage;
                    document.getElementById(`${currentStage}Stage`).classList.remove('hidden');
                    
                    // 渲染对应阶段内容
                    if (currentStage === 'round32') renderRound32();
                    else if (currentStage === 'round16') renderRound16();
                    else if (currentStage === 'quarter') renderQuarterFinals();
                    else if (currentStage === 'semi') renderSemiFinals();
                    else if (currentStage === 'final') renderFinals();
                });
            });
        }

        // 设置所有按钮
        function setupButtons() {
            // 保存按钮
            document.getElementById('saveBtn').addEventListener('click', () => {
                saveResults();
                showToast('保存成功！');
            });
            
            // 生成32强按钮
            document.getElementById('generate32Btn').addEventListener('click', () => {
                if (isGroupStageComplete()) {
                    calculateQualifiedTeams();
                } else {
                    showToast('请先完成所有小组赛！');
                }
            });
            
            // 重置按钮
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (confirm('确定要重置所有模拟结果吗？此操作不可撤销。')) {
                    matchResults = {};
                    localStorage.removeItem('worldCup2026Results');
                    initApp();
                    document.getElementById('championSection').classList.add('hidden');
                    showToast('已重置所有数据！');
                }
            });
        }

        // 检查生成32强按钮状态
        function checkGenerate32Button() {
            const btn = document.getElementById('generate32Btn');
            if (isGroupStageComplete()) {
                btn.disabled = false;
                btn.classList.remove('btn-disabled');
            } else {
                btn.disabled = true;
                btn.classList.add('btn-disabled');
            }
        }

        // 保存结果到本地存储
        function saveResults() {
            localStorage.setItem('worldCup2026Results', JSON.stringify(matchResults));
        }

        // 显示提示框
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('toast-show');
            
            setTimeout(() => {
                toast.classList.remove('toast-show');
            }, 2000);
        }

        // 更新进度条
        function updateProgress() {
            const totalMatches = 104;
            let completedMatches = 0;
            
            // 统计已完成的比赛
            groupMatches.forEach(match => {
                const result = matchResults[match.id];
                if (result && result.score1 !== '' && result.score2 !== '') {
                    completedMatches++;
                }
            });
            
            // 统计淘汰赛已完成的比赛
            const allKnockoutMatches = [
                ...knockoutStructure.round32,
                ...knockoutStructure.round16,
                ...knockoutStructure.quarter,
                ...knockoutStructure.semi,
                ...knockoutStructure.third,
                ...knockoutStructure.final
            ];
            
            allKnockoutMatches.forEach(match => {
                const result = matchResults[match.id];
                if (result && result.score1 !== '' && result.score2 !== '') {
                    completedMatches++;
                }
            });
            
            const progress = (completedMatches / totalMatches) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `${completedMatches}/${totalMatches} 场已完成`;
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
